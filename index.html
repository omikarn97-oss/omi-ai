<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omi AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: url("wallpaper.png") center/cover fixed no-repeat;
            color: white;
            min-height: 100vh;
        }

        .app {
            width: 100%;
            max-width: 800px;
            height: 100vh;
            margin: auto;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 18px;
            text-align: center;
            border-bottom: 1px solid #29304a;
            background: #11182b;
        }

        .header h1 {
            font-size: 24px;
        }

        .header p {
            margin-top: 5px;
            color: #9ca8c7;
            font-size: 13px;
        }

       .sidebar {
    position: fixed;
    top: 0;
    left: -300px;
    width: 280px;
    height: 100vh;
    padding: 18px;
    background: #11182b;
    border-right: 1px solid #29304a;
    z-index: 1000;
    transition: left 0.3s ease;
    overflow-y: auto;
}

.sidebar.open {
    left: 0;
}

#menuBtn {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 1100;
    padding: 8px 12px;
    border: 2px solid #4f8cff;
    border-radius: 10px;
    background: #11182b;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

#menuBtn:active,
#closeMenu:active,
#newChatMenu:active {
    transform: scale(0.94);
}

#closeMenu,
#newChatMenu {
    border: 2px solid #4f8cff;
    border-radius: 10px;
    background: transparent;
    color: white;
    padding: 10px 12px;
    cursor: pointer;
}

#newChatMenu {
    width: 100%;
    margin-top: 15px;
}

.sidebar h3 {
    margin: 22px 0 12px;
}

#recentChats {
    display: flex;
    flex-direction: column;
    gap: 8px;
} #chat {
            flex: 1;
            overflow-y: auto;
            padding: 18px;
        }

        .message {
            max-width: 85%;
            padding: 12px 15px;
            margin-bottom: 12px;
            border-radius: 16px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .user {
            margin-left: auto;
            background: #2563eb;
            border-bottom-right-radius: 4px;
        }

        .ai {
            margin-right: auto;
            background: #1b2438;
            border: 1px solid #303b58;
            border-bottom-left-radius: 4px;
        }

            display: flex;
            gap: 10px;
            padding: 12px;
            background: #11182b;
            border-top: 1px solid #29304a;
        }

        #message {
            flex: 1;
            min-width: 0;
            padding: 13px 15px;
            border-radius: 14px;
            border: 1px solid #43506f;
            outline: none;
            background: #11182b;
            color: white;
            font-size: 16px;
        }

        #message:focus {
            border-color: #4f8cff;
        }

        #send {
            padding: 0 20px;
            border-radius: 14px;
            border: 2px solid #4f8cff;
            background: transparent;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        #send:active {
            transform: scale(0.92);
        }

        #send:disabled {
            opacity: 0.5;
        }

        @media (max-width: 500px) {
            .header {
                padding: 15px;
            }

            #chat {
                padding: 12px;
            }

            .message {
                max-width: 90%;
            }

            #send {
                padding: 0 15px;
            }
        }
    </style>
</head>

<body>
<div id="sidebar" class="sidebar">
    <button id="closeMenu" type="button">✕</button>

    <button id="newChatMenu" type="button">＋ New Chat</button>

    <h3>Recent Chats</h3>

    <div id="recentChats"></div>
</div>

<button id="menuBtn" type="button">☰</button>
<div class="app">

    <div class="header">
        <h1>🤖 Omi AI</h1>
        <p>Your AI Assistant</p>
    </div>

    <div id="chat">
        <div class="message ai">
            Hello! I'm Omi AI. How can I help you today?
        </div>
    </div>

    <div class="input-area">
<input
    type="file"
    id="imageInput"
    accept="image/*,video/*"
    hidden
>

<button id="imageBtn" type="button">
    📷 Photo / 🎥 Video
</button>    
    <input
            id="message"
            type="text"
            placeholder="Type your message..."
            autocomplete="off"
        >

        <button id="send" type="button">
            Send
        </button>
    </div>

</div>

<script>
    const chat = document.getElementById("chat");
    const messageInput = document.getElementById("message");
    const sendButton = document.getElementById("send");
const recentChats = document.getElementById("recentChats");

    function addMessage(text, type) {
        const message = document.createElement("div");

        message.className = "message " + type;
        message.textContent = text;

        chat.appendChild(message);
        chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
    const message = messageInput.value.trim();
    saveRecentChat(message);
        if (!message) {
            return;
        }

        addMessage(message, "user");

        messageInput.value = "";
        sendButton.disabled = true;
        sendButton.textContent = "…";

        try {
            const response = await fetch("https://omi-ai-1.onrender.com/ask", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: message,
                    image: window.selectedImage || null,
                    mimeType: window.selectedMimeType || null
                })
            });

            const data = await response.json();

            if (data.reply) {
                addMessage(data.reply, "ai");
            } else {
                addMessage("Sorry, I couldn't get a response.", "ai");
            }

        } catch (error) {
            console.error(error);
            addMessage(
                "Connection error. Please make sure the Omi AI server is running.",
                "ai"
            );
        }

        sendButton.disabled = false;
        sendButton.textContent = "Send";
        messageInput.focus();
    }

       const sidebar = document.getElementById("sidebar");
    const menuBtn = document.getElementById("menuBtn");
    const closeMenu = document.getElementById("closeMenu");
    const newChatMenu = document.getElementById("newChatMenu");

    menuBtn.addEventListener("click", function() {
        sidebar.classList.add("open");
    });

    closeMenu.addEventListener("click", function() {
        sidebar.classList.remove("open");
    });

    newChatMenu.addEventListener("click", function() {
        chat.innerHTML = `
            <div class="message ai">
                Hello! I'm Omi AI. How can I help you today?
            </div>
        `;
        messageInput.value = "";
        sidebar.classList.remove("open");
        messageInput.focus();
    });    function saveRecentChat(message) {
        let chats = JSON.parse(localStorage.getItem("omiRecentChats") || "[]");

        chats.unshift({
            text: message,
            time: new Date().toLocaleString()
        });

        chats = chats.slice(0, 20);

        localStorage.setItem("omiRecentChats", JSON.stringify(chats));

        showRecentChats();
    }

    function showRecentChats() {
        const chats = JSON.parse(localStorage.getItem("omiRecentChats") || "[]");
        recentChats.innerHTML = "";

        chats.forEach(function(item) {
            const chatItem = document.createElement("button");
            chatItem.textContent = item.text;
            chatItem.className = "recent-chat-item";
            chatItem.addEventListener("click", function() {
                messageInput.value = item.text;
                sidebar.classList.remove("open");
                messageInput.focus();
            });            
recentChats.appendChild(chatItem);
        });
    }

    showRecentChats();

const imageInput = document.getElementById("imageInput");
const imageBtn = document.getElementById("imageBtn");

imageBtn.addEventListener("click", function() {
    imageInput.click();
});

imageInput.addEventListener("change", function() {
    const file = imageInput.files[0];

    if (!file) {
        return;
    }

    if (file.type.startsWith("image/")) {
        const reader = new FileReader();

        reader.onload = function() {
            window.selectedImage = reader.result.split(",")[1];
            window.selectedMimeType = file.type;
        };

        reader.readAsDataURL(file);
    }

    const url = URL.createObjectURL(file);

    if (file.type.startsWith("image/")) {
        const img = document.createElement("img");
        img.src = url;
        img.style.maxWidth = "220px";
        img.style.borderRadius = "12px";
        img.style.margin = "8px 0";
        chat.appendChild(img);
    } else if (file.type.startsWith("video/")) {
        const video = document.createElement("video");
        video.src = url;
        video.controls = true;
        video.style.maxWidth = "260px";
        video.style.borderRadius = "12px";
        video.style.margin = "8px 0";
        chat.appendChild(video);
    }

    chat.scrollTop = chat.scrollHeight;
    imageInput.value = "";
});

sendButton.addEventListener("click", sendMessage);

    messageInput.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
            sendMessage();
        }
    });
</script>

</body>
</html>
